name: Feature request
description: Suggest an improvement or a new feature for Hive.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: You can write in English or Portuguese.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried (optional)

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this was not requested yet.
          required: true
